[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recovery-service"
version = "0.1.0"
description = "Shared contracts for the airline disruption recovery service."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "pyodbc==5.3.0",
    "azure-identity==1.27.0",
    "PyJWT[crypto]==2.15.1",
    "azure-eventhub==5.15.1",
    "azure-kusto-data[aio]==6.0.4",
    "opentelemetry-sdk==1.45.2",
    "tzdata==2026.6",
    "agent-framework-core==1.24.0",
    "agent-framework-foundry==1.16.0",
    "agent-framework-azure-cosmos==1.0.0b261030",
    "agent-framework-a2a==1.0.0b261030",
    "a2a-sdk[http-server]==1.3.0",
    "pyarrow==26.0.1",
    "PyYAML==6.0.3",
    "azure-monitor-opentelemetry==1.8.11",
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "openai==3.43.0",
]

[project.optional-dependencies]
dev = [
    "pip==26.2.1",
    "pip-tools==7.6.2",
    "setuptools==80.9.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "mypy==2.4.1",
    "ruff==0.17.3",
    "types-PyYAML==6.0.12.20261103",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ops_app*", "airline_systems*", "testbench*"]

[tool.setuptools.package-data]
ops_app = ["static/*"]
testbench = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The app tests import arrow_scenario and day_store, as in their images' flat /tests directory.
pythonpath = ["src", "tests", "tests/ops_app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
mypy_path = "src"
python_version = "3.12"
strict = true
